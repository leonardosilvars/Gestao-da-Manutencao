<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão da Manutenção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fixa + área principal rolável; painéis em grade de 12 colunas */
:root {
  --bg0: #06112a; --bg1: #0a1b3f; --side: #07122b;
  --panel: rgba(18, 38, 78, .72); --panel2: rgba(12, 27, 58, .78);
  --line: rgba(120, 160, 240, .16); --line2: rgba(120, 160, 240, .09);
  --txt: #f2f6ff; --mut: #93a8cf; --dim: #6b82ab;
  --blue: #3b82f6; --green: #22c55e; --amber: #f59e0b; --orange: #fb923c; --purple: #a78bfa; --red: #f87171; --cyan: #22d3ee;
  --font: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg0); color: var(--txt); font-family: var(--font); font-size: 14px; line-height: 1.35; font-variant-numeric: tabular-nums; }
button, select { font-family: inherit; }
#app { display: grid; grid-template-columns: 208px minmax(0, 1fr); height: 100%; }

/* barra lateral */
.side { background: linear-gradient(180deg, #08142f 0%, #07122b 60%, #091a3b 100%); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.brand { padding: 26px 16px 18px; text-align: center; }
.brand svg { width: 64px; height: 64px; }
.brand b { display: block; margin-top: 8px; font-size: 19px; line-height: 1.15; font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; position: relative; z-index: 2; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; color: var(--mut); font-size: 14px; font-weight: 600; padding: 11px 12px; border-radius: 10px; cursor: pointer; }
.nav button:hover { background: rgba(80, 120, 220, .12); color: var(--txt); }
.nav button.on { background: linear-gradient(90deg, #2563eb, #3b82f6); color: #fff; box-shadow: 0 6px 18px rgba(37, 99, 235, .35); }
.nav button:focus-visible, select:focus-visible, .seg button:focus-visible, .reset:focus-visible { outline: 2px solid #8bb4ff; outline-offset: 2px; }
.nav svg { width: 20px; height: 20px; flex: none; }
.slogan { margin: 14px 18px 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--mut); font-style: italic; font-size: 13px; position: relative; z-index: 2; }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; z-index: 1; opacity: .95; pointer-events: none; }

/* principal */
.main { overflow-y: auto; padding: 22px 26px 34px; background:
  radial-gradient(900px 420px at 78% -8%, rgba(46, 96, 210, .28), transparent 70%),
  radial-gradient(700px 500px at 5% 100%, rgba(30, 70, 160, .18), transparent 70%),
  linear-gradient(180deg, var(--bg1), var(--bg0)); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.top p { margin: 6px 0 0; color: var(--mut); font-size: 16px; font-weight: 500; }
.upd { display: flex; gap: 8px; align-items: flex-start; color: var(--mut); font-size: 12px; text-align: right; }
.upd b { display: block; color: var(--txt); font-size: 13px; }
.upd svg { width: 20px; height: 20px; margin-top: 1px; }

/* filtros */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 6px; }
.fl { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px 8px; min-width: 120px; flex: 1 1 120px; max-width: 220px; }
.fl.wide { max-width: 250px; }
.fl label { display: block; font-size: 11.5px; font-weight: 700; color: var(--mut); margin-bottom: 3px; letter-spacing: .02em; }
.fl select { width: 100%; background: transparent; color: var(--txt); border: 0; font-size: 13.5px; font-weight: 600; padding: 2px 0; cursor: pointer; text-overflow: ellipsis; }
.fl select option { background: #0c1d45; color: #fff; }
.fl.off { opacity: .45; }
.fl.off select { cursor: not-allowed; }
.reset { align-self: stretch; background: transparent; border: 1px solid var(--line); color: var(--mut); border-radius: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; font-size: 13px; }
.reset:hover { color: #fff; border-color: #5b86d8; }
.scope { color: var(--dim); font-size: 12.5px; margin: 6px 2px 14px; }
.scope b { color: var(--mut); font-weight: 700; }

/* cartões de KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(188px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { display: grid; grid-template-columns: minmax(0, 1fr) 72px; grid-template-areas: "hd hd" "vl sp" "dl dl"; align-items: end; row-gap: 2px; padding: 14px 14px 12px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(145deg, rgba(26, 52, 104, .8), rgba(12, 28, 62, .85)); min-height: 118px; }
.kpi .hd { grid-area: hd; display: flex; align-items: center; gap: 10px; align-self: start; margin-bottom: 4px; }
.kpi .ico { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.kpi .ico svg { width: 18px; height: 18px; }
.kpi .lb { font-size: 13px; font-weight: 700; color: #dbe6ff; line-height: 1.2; }
.kpi .vl { grid-area: vl; font-size: 29px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; }
.kpi .vl small { font-size: 16px; font-weight: 700; margin-left: 2px; color: #dbe6ff; }
.kpi .sp { grid-area: sp; height: 34px; align-self: center; }
.kpi .sp svg { width: 100%; height: 100%; display: block; }
.kpi .dl { grid-area: dl; font-size: 12px; font-weight: 700; color: var(--mut); white-space: nowrap; }
.kpi .dl.pos { color: var(--green); } .kpi .dl.neg { color: var(--red); }
.kpi .dl span { color: var(--mut); font-weight: 500; margin-left: 4px; }

/* painéis */
.g { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 14px; min-width: 0; display: flex; flex-direction: column; }
.panel > header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
.panel > header .pi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.panel > header .pi svg { width: 15px; height: 15px; }
.panel > header h3 { margin: 0; font-size: 16px; font-weight: 800; flex: 1; min-width: 0; text-wrap: balance; }
.panel .hint { font-size: 12px; color: var(--dim); margin: -2px 0 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--mut); font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer; }
.seg button.on { background: #2b5fd0; color: #fff; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mut); margin-bottom: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.axis { fill: var(--dim); font-size: 11px; font-family: var(--font); }
.empty { color: var(--dim); padding: 28px 0; text-align: center; font-size: 13px; }

/* barras horizontais */
.hb { display: grid; grid-template-columns: minmax(70px, 34%) 1fr auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.hb .lb { color: #dbe6ff; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.hb .tr { position: relative; height: 10px; border-radius: 6px; background: rgba(120, 160, 240, .12); }
.hb .fi { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.hb .rf { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; opacity: .7; }
.hb .vl { font-weight: 800; text-align: right; white-space: nowrap; }
.hb .vl small { color: var(--mut); font-weight: 600; margin-left: 5px; }

/* rosca */
.dn { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; padding: 6px 0; }
.dn svg { flex: none; }
.dn ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13px; }
.dn li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dn li i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dn li b { font-weight: 700; }
.dn li span { color: var(--mut); font-size: 12px; }

/* tabelas */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--mut); font-weight: 700; font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
td.wrap { white-space: normal; min-width: 160px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
.pill.red { background: rgba(248, 113, 113, .16); color: #fca5a5; }
.pill.amber { background: rgba(245, 158, 11, .16); color: #fcd34d; }
.pill.blue { background: rgba(59, 130, 246, .2); color: #93c5fd; }
.pill.green { background: rgba(34, 197, 94, .16); color: #86efac; }
.pill.gray { background: rgba(147, 168, 207, .16); color: #c3d0ea; }

/* alertas */
.al { display: grid; gap: 10px; }
.al div { display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(8, 18, 42, .45); border: 1px solid var(--line2); }
.al i { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
.al b { display: block; font-size: 13.5px; }
.al span { color: var(--mut); font-size: 12.5px; }
.al.crit i { background: var(--red); }
.note { color: var(--dim); font-size: 12px; margin: 4px 2px 0; }

/* dica flutuante */
#tip { position: fixed; left: 0; top: 0; display: none; pointer-events: none; z-index: 50; background: #0b1a3a; border: 1px solid #3b5fa8; border-radius: 10px; padding: 8px 11px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); max-width: 260px; }
#tip b { display: block; margin-bottom: 3px; }
#tip div { display: flex; justify-content: space-between; gap: 14px; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

@media (max-width: 1180px) { .c3, .c4 { grid-column: span 6; } .c5, .c7, .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .side { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .brand { display: none; } .slogan, .skyline { display: none; }
  .nav { flex-direction: row; padding: 8px 10px; } .nav button { white-space: nowrap; padding: 9px 12px; }
  .main { padding: 16px 16px 28px; }
  .top h1 { font-size: 26px; }
  .c3, .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
  .fl { max-width: none; }
}
@media (prefers-reduced-motion: no-preference) { .nav button, .fl, .reset { transition: background .15s, border-color .15s; } }

/* carga de planilha */
.topr { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
.upd .chip { display: block; margin-top: 4px; width: fit-content; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
.chip.warn { background: rgba(245, 158, 11, .16); color: #fcd34d; } .chip.ok { background: rgba(34, 197, 94, .16); color: #86efac; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(80, 120, 220, .14); color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn svg { width: 17px; height: 17px; } .btn:hover { border-color: #5b86d8; background: rgba(80, 120, 220, .24); }
.btn.pri { background: linear-gradient(90deg, #2563eb, #3b82f6); border-color: transparent; box-shadow: 0 6px 16px rgba(37, 99, 235, .32); }
.btn:focus-visible { outline: 2px solid #8bb4ff; outline-offset: 2px; }
.modal { position: fixed; inset: 0; background: rgba(3, 9, 24, .72); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal[hidden] { display: none; }
.mbox { background: #0b1a3d; border: 1px solid #3b5fa8; border-radius: 16px; width: min(760px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 20px 22px 22px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); }
.mbox header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mbox h2 { margin: 0; font-size: 22px; font-weight: 800; }
.mbox .x { background: transparent; border: 0; color: var(--mut); font-size: 26px; line-height: 1; cursor: pointer; padding: 2px 8px; border-radius: 8px; }
.mbox .x:hover { color: #fff; background: rgba(120, 160, 240, .15); }
.mbox p { color: #c9d6f2; margin: 8px 0 12px; }
.mbox td b { color: #fff; } .mbox td span { color: var(--mut); }
.mbox td { white-space: normal; vertical-align: top; }
.mbox .mnote { font-size: 12.5px; color: var(--mut); margin-top: 12px; }
.mact { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.mst { margin-top: 14px; border-radius: 10px; font-size: 13.5px; }
.mst:not(:empty) { padding: 11px 13px; border: 1px solid var(--line); background: rgba(80, 120, 220, .1); }
.mst.ok { border-color: rgba(34, 197, 94, .45); background: rgba(34, 197, 94, .1); }
.mst.warn { border-color: rgba(245, 158, 11, .5); background: rgba(245, 158, 11, .1); }
.mst.err { border-color: rgba(248, 113, 113, .55); background: rgba(248, 113, 113, .1); }
.mst ul { margin: 6px 0 6px 18px; padding: 0; }

</style>
</head>

/* ===== Carga de planilha (.xlsx) =====
   Lê o arquivo no próprio navegador (nada é enviado a servidor), converte as abas para o formato interno
   do painel e recalcula tudo. Para adaptar a outro layout de colunas, altere somente SPEC e buildD(). */

/* --- leitor mínimo de .xlsx (zip + XML), sem bibliotecas --- */
async function inflateRaw(u8) {
  const out = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(out).arrayBuffer());
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf); let e = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('O arquivo não é um .xlsx válido. Se for .xls ou .csv, salve como Pasta de Trabalho do Excel (.xlsx).');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    files[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl))] = { method, csz, lo }; p += 46 + nl + el + cl;
  }
  return { get: async name => {
    const f = files[name]; if (!f) return null;
    const s = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true), raw = u8.subarray(s, s + f.csz);
    return new TextDecoder('utf-8').decode(f.method === 0 ? raw : await inflateRaw(raw));

}

  const z = await unzip(buf), dp = new DOMParser(), X = t => dp.parseFromString(t, 'application/xml');
  const wbx = await z.get('xl/workbook.xml'); if (!wbx) throw new Error('O arquivo não parece ser uma planilha do Excel (.xlsx).');
  const wb = X(wbx), rels = X(await z.get('xl/_rels/workbook.xml.rels')), relMap = {};
  rels.querySelectorAll('Relationship').forEach(r => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const ss = [], sst = await z.get('xl/sharedStrings.xml');
  if (sst) X(sst).querySelectorAll('si').forEach(si => ss.push([...si.querySelectorAll('t')].map(t => t.textContent).join('')));
  const sheets = {};
  for (const sh of wb.querySelectorAll('sheets > sheet')) {
    const rid = sh.getAttribute('r:id'); let tg = relMap[rid]; if (!tg) continue;
    tg = tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg;
    const xml = await z.get(tg); if (!xml) continue;
    const rows = [];
    X(xml).querySelectorAll('sheetData > row').forEach(r => {
      const arr = [];
      r.querySelectorAll(':scope > c').forEach(c => {
        const t = c.getAttribute('t'), vEl = c.querySelector('v'); let v = null;
        if (t === 'inlineStr') v = [...c.querySelectorAll('is t')].map(x => x.textContent).join('');
        else if (vEl && vEl.textContent !== '') {
          const raw = vEl.textContent;
          v = t === 's' ? ss[+raw] : t === 'str' ? raw : t === 'b' ? raw === '1' : t === 'e' ? null : parseFloat(raw);
        }
        arr[colIdx(c.getAttribute('r'))] = v;
      });

}

/* --- normalização de nomes e valores --- */
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const toMs = v => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Math.round((v - 25569) * 1440) * 60000;
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?:[ T](\d{1,2}):(\d{2}))?/))) return Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/))) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0));
  return null;
};
const toMin = v => { const ms = toMs(v); return ms == null ? -1 : Math.round((ms - BASE_MS) / 60000); };
const toDay = v => { const ms = toMs(v); return ms == null ? -1 : Math.floor((ms - BASE_MS) / 86400000); };
const toNum = v => {
  if (v == null || v === '') return null; if (typeof v === 'number') return v;
  const s = String(v).trim().replace(/\s/g, ''); const n = parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
  return isNaN(n) ? null : n;
};
const yes = v => ['s', 'sim', 'x', '1', 'true', 'y'].includes(norm(v));

/* --- layout esperado (editar aqui para outro formato de planilha) --- */
const SPEC = {
  equipamentos: { nomes: ['equipamentos', 'equipamento'], obrig: ['Equipamento', 'Tag', 'Tipo_Equipamento', 'Area', 'Criticidade'], opc: ['Centro_Trabalho_Resp'] },
  ordens: { nomes: ['ordens', 'ordem'], obrig: ['Ordem', 'Tipo_Ordem', 'Equipamento', 'Centro_Trabalho', 'Origem', 'Programada', 'Data_Criacao', 'Texto_Breve'],
    opc: ['Prioridade', 'Status_Usuario', 'Data_Inicio_Programada', 'Data_Inicio_Real', 'Data_Fim_Real', 'Data_TECO', 'HH_Planejado', 'HH_Real', 'Duracao_Execucao_h', 'Parada_Equipamento'] },
  notificacoes: { nomes: ['notificacoes', 'notificacao'], obrig: ['Ordem', 'Equipamento', 'Inicio_Avaria', 'Parada_Equipamento', 'Horas_Parada'], opc: ['Cod_Dano'] },
  programacao: { nomes: ['programacao_semanal', 'programacao'], obrig: ['Ordem', 'Data_Planejada'], opc: [] },
  catalogo: { nomes: ['catalogo_falhas', 'catalogofalhas'], obrig: [], opc: ['Cod_Dano', 'Descricao_Dano'], facultativa: true },
};
const SPEC_TITULOS = { equipamentos: 'Equipamentos', ordens: 'Ordens', notificacoes: 'Notificacoes', programacao: 'Programacao_Semanal', catalogo: 'Catalogo_Falhas (opcional)' };

function tabelaDe(rows) {
  if (!rows || !rows.length) return { cols: [], recs: [] };
  const head = (rows[0] || []).map(norm), recs = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r.some(x => x != null && x !== '')) continue;
    const o = {}; head.forEach((h, j) => { if (h) o[h] = r[j] == null ? null : r[j]; }); recs.push(o);
  }
  return { cols: head, recs };
}

/* --- planilha -> formato interno do painel --- */
function buildD(sheets, srcName) {
  const problemas = [], avisos = [], T = {};
  const nomes = Object.keys(sheets);
  for (const [k, sp] of Object.entries(SPEC)) {
    const nm = nomes.find(n => sp.nomes.includes(norm(n)));
    if (!nm) { if (!sp.facultativa) problemas.push('Aba "' + SPEC_TITULOS[k] + '" não encontrada. Abas no arquivo: ' + nomes.join(', ') + '.'); continue; }
    T[k] = tabelaDe(sheets[nm]);
    const falta = sp.obrig.filter(c => !T[k].cols.includes(norm(c)));
    if (falta.length) problemas.push('Aba "' + nm + '": faltam as colunas ' + falta.join(', ') + '.');
  }
  if (problemas.length) { const e = new Error('Planilha fora do formato esperado.'); e.problemas = problemas; throw e; }

  const eqIdx = {}, eq = [];
  T.equipamentos.recs.forEach(r => {
    const id = String(r.equipamento); if (eqIdx[id] != null) return;
    const ct = norm(r.centro_trabalho_resp || '');
    eqIdx[id] = eq.length; eq.push([String(r.tag), String(r.tipo_equipamento), String(r.area), String(r.criticidade), ct.startsWith('ele') ? 1 : ct.startsWith('ins') ? 2 : 0]);
  });
  const danoIdx = {}, danos = [];
  if (T.catalogo) T.catalogo.recs.forEach(r => { if (r.cod_dano != null) { danoIdx[String(r.cod_dano)] = danos.length; danos.push(String(r.descricao_dano || r.cod_dano)); } });
  const getDano = c => { if (c == null) return -1; const k = String(c); if (danoIdx[k] == null) { danoIdx[k] = danos.length; danos.push(k); } return danoIdx[k]; };

  const hpByOrd = {};
  T.notificacoes.recs.forEach(r => { if (yes(r.parada_equipamento)) hpByOrd[String(r.ordem)] = (hpByOrd[String(r.ordem)] || 0) + (toNum(r.horas_parada) || 0); });
  const oIdx = {}, o = []; let semEq = 0, tipoInv = 0, semData = 0;
  T.ordens.recs.forEach(r => {
    const id = String(r.ordem), ei = eqIdx[String(r.equipamento)];
    if (ei == null) { semEq++; return; }
    const tp = norm(r.tipo_ordem), t = tp === 'pm01' || tp.startsWith('corret') ? 0 : tp === 'pm02' || tp.startsWith('prevent') ? 1 : tp === 'pm03' || tp.startsWith('predit') ? 2 : -1;
    if (t < 0) { tipoInv++; return; }
    const cr = toMin(r.data_criacao); if (cr < 0) { semData++; return; }
    const ct = norm(r.centro_trabalho), og = norm(r.origem), su = norm(r.status_usuario);
    const ini = toMin(r.data_inicio_real), fim = toMin(r.data_fim_real);
    let dur = toNum(r.duracao_execucao_h); if (dur == null) dur = (ini >= 0 && fim >= 0) ? (fim - ini) / 60 : -1;
    const pa = yes(r.parada_equipamento) ? 1 : 0, pr = parseInt(r.prioridade, 10);
    oIdx[id] = o.length;
    o.push([Number(r.ordem) || id, t, ei, ct.startsWith('ele') ? 1 : ct.startsWith('ins') ? 2 : 0, isNaN(pr) ? 3 : pr,
      su.includes('agmt') ? 1 : su.includes('agpa') ? 2 : 0, og.startsWith('emerg') ? 1 : og.startsWith('rota') ? 2 : og.startsWith('solic') ? 3 : 0,
      yes(r.programada) ? 1 : 0, toDay(r.data_inicio_programada), cr, ini, fim, toDay(r.data_teco),
      +(toNum(r.hh_planejado) || 0).toFixed(2), +(toNum(r.hh_real) || 0).toFixed(2), dur < 0 ? -1 : +dur.toFixed(2), pa, String(r.texto_breve == null ? '' : r.texto_breve),
      +((hpByOrd[id] || 0)).toFixed(2)]);
  });
  const n = []; let nSem = 0;
  T.notificacoes.recs.forEach(r => {
    const ei = eqIdx[String(r.equipamento)], ini = toMin(r.inicio_avaria);
    if (ei == null || ini < 0) { nSem++; return; }
    n.push([ei, oIdx[String(r.ordem)] == null ? -1 : oIdx[String(r.ordem)], ini, +(toNum(r.horas_parada) || 0).toFixed(2), yes(r.parada_equipamento) ? 1 : 0, getDano(r.cod_dano)]);
  });
  if (!o.length) { const e = new Error('Nenhuma ordem válida foi encontrada.'); e.problemas = ['Verifique se os códigos de equipamento da aba Ordens existem na aba Equipamentos e se Tipo_Ordem e Data_Criacao estão preenchidos.']; throw e; }

  /* período e data da extração a partir dos próprios dados */
  let minD = Infinity, maxD = -Infinity;
  o.forEach(r => { if (r[11] >= 0) { const d = Math.floor(r[11] / DAYM); minD = Math.min(minD, d); maxD = Math.max(maxD, d); } });
  n.forEach(r => { const d = Math.floor(r[2] / DAYM); minD = Math.min(minD, d); maxD = Math.max(maxD, d); });
  if (!isFinite(minD)) { const e = new Error('Sem ordens executadas nem notificações.'); e.problemas = ['É preciso haver ao menos uma ordem com Data_Fim_Real ou uma notificação com Inicio_Avaria.']; throw e; }
  const s0 = dayDate(minD), p0 = dayOf(s0.getUTCFullYear(), s0.getUTCMonth(), 1), p1 = maxD, extr = maxD + 1; /* a extração é considerada feita no dia seguinte ao último evento */

  /* programação semanal: o flag "executada na semana" é calculado aqui (segunda a domingo, sem tolerância) */
  const p = []; let pSem = 0;
  T.programacao.recs.forEach(r => {
    const oi = oIdx[String(r.ordem)], dp = toDay(r.data_planejada);
    if (oi == null || dp < 0) { pSem++; return; }
    const ws = dp - ((dayDate(dp).getUTCDay() + 6) % 7), fim = o[oi][11], fd = fim >= 0 ? Math.floor(fim / DAYM) : -1;
    p.push([oi, dp, ws, ws > p1 ? 2 : (fd >= ws && fd <= ws + 6 ? 1 : 0)]);
  });
  if (semEq) avisos.push(semEq + ' ordens ignoradas: equipamento não encontrado na aba Equipamentos.');
  if (tipoInv) avisos.push(tipoInv + ' ordens ignoradas: Tipo_Ordem diferente de PM01, PM02 ou PM03.');
  if (semData) avisos.push(semData + ' ordens ignoradas: Data_Criacao vazia ou inválida.');
  if (nSem) avisos.push(nSem + ' notificações ignoradas: equipamento não encontrado ou Inicio_Avaria inválido.');
  if (pSem) avisos.push(pSem + ' linhas da programação ignoradas: ordem não encontrada ou Data_Planejada inválida.');
  if (!p.length) avisos.push('A aba de programação não gerou linhas: o painel de aderência ficará vazio.');

async function handleFile(file) {

    const sheets = await readXlsx(await file.arrayBuffer()), { D: Dn, avisos } = buildD(sheets, file.name);
    applyData(Dn);
    setStatus('<b>Planilha carregada.</b> ' + n0(Dn.o.length) + ' ordens, ' + n0(Dn.n.length) + ' notificações e ' + n0(Dn.p.length) + ' linhas de programação. Período: ' + fmtD(Dn.p0) + ' a ' + fmtD(Dn.p1) + '.' +
      (avisos.length ? '<ul>' + avisos.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : ''), avisos.length ? 'warn' : 'ok');
  } catch (e) {
    setStatus('<b>Não foi possível carregar.</b> ' + esc(e.message) + (e.problemas ? '<ul>' + e.problemas.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '') + 'Os dados que já estavam no painel foram mantidos.', 'err');
  }
}
function buildModal() {
  const d = document.createElement('div'); d.id = 'modal'; d.className = 'modal'; d.hidden = true;
  d.innerHTML = '<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="m-title"><header><h2 id="m-title">Carregar planilha</h2><button type="button" class="x" id="m-close" aria-label="Fechar">×</button></header>' +
    '<p>Escolha o arquivo <b>.xlsx</b> da semana ou arraste-o para cá. O painel lê e recalcula tudo no seu navegador; o arquivo não é enviado a nenhum servidor.</p>' +
    '<div class="tw"><table><thead><tr><th>Aba</th><th>Colunas (<b>obrigatórias</b> em destaque)</th></tr></thead><tbody>' + modalBody() + '</tbody></table></div>' +
    '<p class="mnote">Datas no formato do Excel ou dd/mm/aaaa hh:mm. Tipo_Ordem: PM01 corretiva, PM02 preventiva, PM03 preditiva. Programada, Parada_Equipamento: S ou N. Equipe (Centro_Trabalho): MECAN, ELETR ou INSTR. A aderência semanal é calculada pelo painel a partir da Data_Planejada e da Data_Fim_Real.</p>' +
    '<div class="mact"><input type="file" id="m-file" accept=".xlsx" hidden><button type="button" class="btn pri" id="m-pick">Escolher arquivo .xlsx</button><button type="button" class="btn" id="m-reset">Voltar aos dados de exemplo</button></div>' +
    '<div id="m-status" class="mst" role="status" aria-live="polite"></div></div>';
  document.body.appendChild(d);
  document.getElementById('m-pick').addEventListener('click', () => document.getElementById('m-file').click());
  document.getElementById('m-file').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-reset').addEventListener('click', () => { applyData(ORIGINAL_D); setStatus('Painel voltou aos dados de exemplo.', 'ok'); });
  d.addEventListener('click', e => { if (e.target === d) closeModal(); });
  d.addEventListener('dragover', e => { e.preventDefault(); });
  d.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !d.hidden) closeModal(); });
  document.getElementById('btn-load').addEventListener('click', openModal);
}
buildModal(); updateHeader();

</script>
